# Banco de teste isolado e descartável (sem volume persistente).
name: tio-patinhas-teste

services:
  db-teste:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: financas_teste
      POSTGRES_USER: teste
      POSTGRES_PASSWORD: teste
      TZ: UTC
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teste -d financas_teste"]
      interval: 2s
      timeout: 2s
      retries: 15
