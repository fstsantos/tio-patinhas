[project]
name = "financas"
version = "0.1.0"
description = "Tio Patinhas — gerenciador financeiro familiar (bot do Telegram + web administrativa)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.14,<2",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "argon2-cffi>=23.1",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "python-telegram-bot>=21.6,<22",
    "httpx>=0.27",
    "typer>=0.12",
]

[project.optional-dependencies]
voz = ["faster-whisper>=1.0"]

[project.scripts]
financas = "financas.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.115",
    "coverage[toml]>=7.6",
    "pytest-cov>=6.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pgserver>=0.1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/financas"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "S", "DTZ", "PL"]
ignore = [
    "PLR0913",  # serviços de negócio recebem muitos parâmetros nomeados
    "PLR2004",  # constantes numéricas de regras de negócio são explícitas
    "RUF001", "RUF002", "RUF003",  # textos em português
    "N818",
    "PLR0911",  # despachantes de comandos usam retornos antecipados
    "S101",  # assert só para invariantes/estreitamento de tipos, nunca validação de entrada  # exceções de domínio têm nomes em português (ValorInvalido)
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR0915", "PLR0917", "PLC0415", "DTZ001"]
"migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["financas"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pgserver.*", "faster_whisper.*", "av.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "integration: requer PostgreSQL real",
]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["financas"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
