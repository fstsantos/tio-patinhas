# Execução local: PostgreSQL + migração + web + bot (mesma imagem).
name: tio-patinhas

x-app: &app
  build: .
  image: tio-patinhas:local
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://financas:${POSTGRES_PASSWORD:?defina no .env}@db:5432/financas
  depends_on:
    db:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: financas
      POSTGRES_USER: financas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina no .env}
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financas -d financas"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    <<: *app
    ports:
      - "127.0.0.1:8000:8000"

  bot:
    <<: *app
    command: ["python", "-m", "financas.bot.app"]
    healthcheck:
      disable: true
    volumes:
      - modelos:/home/financas/.cache/huggingface

volumes:
  pgdata:
  modelos:
